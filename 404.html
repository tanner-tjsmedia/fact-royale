<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Royale — Under Siege</title>
<meta name="description" content="Fact Royale is temporarily unavailable.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Fact Royale — Under Siege">
<meta property="og:description" content="We're having trouble. The keep is holding.">
<style>
:root{
  --gold:#d4af37; --gold-lt:#f5dd8f; --gold-dk:#8a7024;
  --flame:#f0a92a; --flame-hot:#ffd77a; --muted:#8b88a0;
  --timber:#4a3822; --timber-lt:#6b5231; --timber-dk:#2e2315;
  --iron:#5a5a6e; --stone-a:#232336; --stone-b:#1b1b2b; --stone-c:#2b2b40;
  --mx:0; --my:0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#05050b; color:#eceaf3; overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;padding:16px;
}
.stage{perspective:1250px;perspective-origin:50% 48%;
  width:min(900px,97vw);height:min(400px,50vh);position:relative;margin-bottom:4px}
.world{position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateY(calc(var(--mx) * 6deg)) rotateX(calc(var(--my) * -2.2deg));
  transition:transform .4s cubic-bezier(.2,.7,.3,1)}
.layer{position:absolute;inset:0;transform-style:preserve-3d}
.layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.z-sky{transform:translateZ(-820px) scale(1.68)}
.z-moon{transform:translateZ(-660px) scale(1.55)}
.z-hills{transform:translateZ(-500px) scale(1.42)}
.z-keep{transform:translateZ(-360px) scale(1.30)}
.z-fog1{transform:translateZ(-250px) scale(1.21)}
.z-wall{transform:translateZ(-100px) scale(1.08)}
.z-treb{transform:translateZ(50px) scale(.96)}
.z-camp{transform:translateZ(170px) scale(.86)}
.z-fore{transform:translateZ(300px) scale(.76)}

/* ── siege cycle, 6.4s. every part keyed to the same clock ── */
@keyframes beam{
  0%,10%{transform:rotate(-35deg)}
  18%{transform:rotate(126deg)}
  23%{transform:rotate(107deg)}
  28%{transform:rotate(120deg)}
  33%{transform:rotate(111deg)}
  38%{transform:rotate(117deg)}
  46%{transform:rotate(115deg)}
  62%{transform:rotate(115deg)}
  94%,100%{transform:rotate(-35deg)}
}
.beam{transform-origin:155px 104px;animation:beam 6.4s cubic-bezier(.5,0,.35,1) infinite}

/* counterweight hangs true: counter-rotates against the beam */
@keyframes cw{
  0%,10%{transform:rotate(35deg)}
  18%{transform:rotate(-134deg)}
  23%{transform:rotate(-100deg)}
  28%{transform:rotate(-124deg)}
  33%{transform:rotate(-108deg)}
  38%{transform:rotate(-119deg)}
  46%{transform:rotate(-115deg)}
  62%{transform:rotate(-115deg)}
  94%,100%{transform:rotate(35deg)}
}
.cw{transform-origin:196px 118px;animation:cw 6.4s cubic-bezier(.5,0,.35,1) infinite}

/* sling trails, then whips past the beam and lets go */
@keyframes sling{
  0%,10%{transform:rotate(0deg)}
  16%{transform:rotate(-62deg)}
  19%{transform:rotate(-128deg)}
  22%{transform:rotate(-172deg);opacity:1}
  26%{transform:rotate(-202deg);opacity:.85}
  34%{transform:rotate(-180deg);opacity:.85}
  48%{transform:rotate(-192deg);opacity:.85}
  62%{transform:rotate(-192deg);opacity:.85}
  94%,100%{transform:rotate(0deg);opacity:1}
}
.sling{transform-origin:60px 96px;animation:sling 6.4s cubic-bezier(.5,0,.35,1) infinite}

/* frame recoils and rolls back, then is winched forward again */
@keyframes recoil{
  0%,12%{transform:translateX(0)}
  20%{transform:translateX(7px)}
  26%{transform:translateX(9px)}
  60%{transform:translateX(9px)}
  92%,100%{transform:translateX(0)}
}
.rig{animation:recoil 6.4s ease-out infinite}

@keyframes shot{
  0%,19%{transform:translate(114px,-61px);opacity:0}
  20%{opacity:1}
  26%{transform:translate(150px,-72px)}
  32%{transform:translate(186px,-66px)}
  38%{transform:translate(214px,-44px)}
  43%{transform:translate(230px,-8px)}
  45%{transform:translate(236px,20px);opacity:1}
  47%{transform:translate(238px,30px);opacity:0}
  100%{opacity:0}
}
.shot{animation:shot 6.4s cubic-bezier(.35,0,.7,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shot-spin{transform-origin:46px 106px;animation:spin 1.1s linear infinite}

@keyframes hit{0%,44%{opacity:0;transform:scale(.3)}47%{opacity:1;transform:scale(1)}
  60%{opacity:0;transform:scale(2.1)}100%{opacity:0}}
.hit{transform-origin:258px 150px;animation:hit 6.4s ease-out infinite}
@keyframes hit2{0%,45%{opacity:0}48%{opacity:.9}56%{opacity:0}100%{opacity:0}}
.spark{animation:hit2 6.4s ease-out infinite}

@keyframes shake{0%,44%{transform:translate(0,0)}47%{transform:translate(-3px,2px)}
  50%{transform:translate(2.5px,-1.5px)}53%{transform:translate(-1.5px,1px)}
  56%{transform:translate(.7px,-.4px)}59%,100%{transform:translate(0,0)}}
.shake{animation:shake 6.4s linear infinite}

@keyframes rubble{0%,45%{opacity:0;transform:translate(0,0) rotate(0)}
  50%{opacity:.85}88%{opacity:0;transform:translate(-22px,26px) rotate(150deg)}100%{opacity:0}}
.rubble{animation:rubble 6.4s ease-in infinite}
.r2{animation-delay:.1s}.r3{animation-delay:.2s}.r4{animation-delay:.3s}

/* winch turning while the crew re-cocks */
@keyframes winch{0%,62%{transform:rotate(0)}92%,100%{transform:rotate(-540deg)}}
.winch{transform-origin:186px 200px;animation:winch 6.4s ease-in-out infinite}

@keyframes flick{0%,100%{opacity:.9;transform:scale(1) translateY(0)}
  40%{opacity:.55;transform:scale(.85) translateY(1px)}
  70%{opacity:1;transform:scale(1.12) translateY(-1px)}}
.flame{transform-origin:bottom center;animation:flick 1.5s ease-in-out infinite}
.f2{animation-delay:.4s}.f3{animation-delay:.8s}.f4{animation-delay:1.1s}

@keyframes ripple{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(3.4deg) scaleX(.92)}}
.banner{animation:ripple 3.4s ease-in-out infinite}
.bn2{animation-duration:4.1s;animation-delay:.7s}
.bn3{animation-duration:3.7s;animation-delay:1.4s}

@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.9}
  100%{transform:translateY(-120px) scale(1.1);opacity:0}}
.ember{animation:rise 4.6s ease-out infinite}
.e2{animation-duration:5.9s;animation-delay:.9s}
.e3{animation-duration:4.1s;animation-delay:1.9s}
.e4{animation-duration:6.3s;animation-delay:2.8s}
.e5{animation-duration:5.2s;animation-delay:3.6s}
.e6{animation-duration:4.8s;animation-delay:1.3s}

@keyframes smoke{0%{transform:translateY(0) scale(.7);opacity:0}
  25%{opacity:.22}100%{transform:translateY(-70px) scale(2.1);opacity:0}}
.smoke{animation:smoke 7s ease-out infinite}
.s2{animation-delay:2.3s}.s3{animation-delay:4.6s}

@keyframes drift{0%{transform:translateX(-7%)}100%{transform:translateX(7%)}}
.fog{animation:drift 28s ease-in-out infinite alternate}
.fog2{animation-duration:21s;animation-direction:alternate-reverse}
@keyframes cloud{0%{transform:translateX(-40px)}100%{transform:translateX(430px)}}
.cloud{animation:cloud 64s linear infinite}
.cl2{animation-duration:88s;animation-delay:-30s}

@keyframes twinkle{0%,100%{opacity:.22}50%{opacity:.85}}
.star{animation:twinkle 4s ease-in-out infinite}

@keyframes pace{0%,100%{transform:translateX(0)}50%{transform:translateX(13px)}}
.pace{animation:pace 9s ease-in-out infinite}
.pace2{animation-duration:11s;animation-direction:reverse}

/* ── hidden siege game ──────────────────────────────────
   Taking the trebuchet stops the idle loop and hands the mechanism to JS.
   The CSS animations and the game drive the same transforms, so only one of
   them may be running at a time. */
.playing .beam,.playing .cw,.playing .sling,.playing .shot,
.playing .rig,.playing .winch{animation:none!important}
.stage{cursor:default;
  /* A long press on a phone otherwise selects text, pops the callout menu, or
     scrolls the page instead of winding the counterweight. */
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage.armable{cursor:crosshair}
.quit{position:absolute;top:4px;left:8px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#4e4c60;border:1px solid #2c2c44;border-radius:4px;
  padding:4px 9px;display:none;cursor:pointer;background:#0f0f1c;pointer-events:auto}
.playing .quit{display:block}
.quit:hover{color:var(--gold);border-color:var(--gold-dk)}
.hud{position:absolute;top:6px;right:10px;font-size:11px;letter-spacing:.14em;
  color:#4e4c60;text-transform:uppercase;pointer-events:none;transition:color .3s}
.playing .hud{color:#7c7892}
.hud b{color:var(--gold);font-weight:600}
.meter{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:168px;height:5px;background:#16162a;border:1px solid #2c2c44;border-radius:3px;
  opacity:0;transition:opacity .18s;pointer-events:none;overflow:hidden}
.meter.on{opacity:1}
.meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--flame),var(--flame-hot))}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:11.5px;letter-spacing:.1em;color:#3a3849;text-transform:uppercase;
  opacity:0;transition:opacity 1.1s,color .3s;pointer-events:none;white-space:nowrap;
  text-align:center;max-width:94%}
.hint.on{opacity:1}
.playing .hint{opacity:1;color:#56546a}
@media(max-height:560px){
  .stage{height:min(300px,44vh)}
  h1{font-size:clamp(24px,5vw,34px);margin:6px 0 4px}
  .tiny{margin-top:10px}
}
h1{font-size:clamp(30px,6vw,50px);margin:10px 0 8px;color:var(--gold-lt);
  letter-spacing:.02em;font-weight:700;text-align:center;
  text-shadow:0 0 36px rgba(212,175,55,.3)}
.line{color:var(--muted);font-size:clamp(15px,2.1vw,17px);text-align:center;margin:0;max-width:36ch}
.tiny{color:#5f5d70;font-size:12.5px;margin-top:18px;text-align:center;letter-spacing:.03em}
.tiny a{color:#7a7690;text-decoration:none;border-bottom:1px solid #34324a}
.tiny a:hover{color:var(--gold)}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
  .world{transform:none!important;transition:none!important}
}
</style>
</head>

<h1>Under Siege</h1>
<p class="line">Fact Royale is unavailable while we make repairs.</p>
<p class="tiny">
  Your streak, stats and history are secure &nbsp;·&nbsp;
  <a href="mailto:tanner@tjs16media.com?subject=Fact%20Royale">Get in touch</a>
</p>

<script>
(function(){
  var root = document.documentElement;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tx=0, ty=0, cx=0, cy=0, drift=0, raf;
  function tick(){
    cx += (tx-cx)*0.06; cy += (ty-cy)*0.06; drift += 0.003;
    root.style.setProperty('--mx', (cx + Math.sin(drift)*0.2).toFixed(4));
    root.style.setProperty('--my', cy.toFixed(4));
    raf = requestAnimationFrame(tick);
  }
  tick();
  addEventListener('pointermove', function(e){
    tx = (e.clientX/innerWidth - .5)*2; ty = (e.clientY/innerHeight - .5)*2;
  }, {passive:true});
  addEventListener('pointerleave', function(){ tx=0; ty=0; }, {passive:true});
  addEventListener('deviceorientation', function(e){
    // iOS returns null here until permission is granted; we never prompt.
    if (e.gamma == null) return;
    tx = Math.max(-1, Math.min(1, e.gamma/30));
    ty = Math.max(-1, Math.min(1, ((e.beta||45)-45)/30));
  }, {passive:true});
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(tick);
  });
})();

// ── The siege, playable ────────────────────────────────────────────────
// Hold to wind the counterweight, release to loose. Same mechanism the idle
// loop drives, handed over to physics. Discovered rather than advertised —
// the hint only appears if you have been sitting here a while.
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var stage = document.querySelector('.stage'),
      beam  = document.getElementById('gBeam'), cw    = document.getElementById('gCw'),
      sling = document.getElementById('gSling'), shot = document.getElementById('gShot'),
      shake = document.getElementById('gShake'), hitG = document.getElementById('gHit'),
      dmgG  = document.getElementById('gDmg'),
      hud   = document.getElementById('hud'), meter = document.getElementById('meter'),
      fill  = document.getElementById('meterFill'), hint = document.getElementById('hint'),
      quit  = document.getElementById('quit');
  if (!beam || !stage) return;

  // Touch devices get different words and an on-screen exit, because there is
  // no space bar and no Escape key to tell them about.
  var TOUCH = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  var TAKE  = TOUCH ? 'touch and hold the trebuchet' : 'hold space to take the trebuchet';
  var PLAY  = TOUCH ? 'hold to wind  ·  release to loose'
                    : 'hold to wind  ·  release to loose  ·  esc to stand down';

  var cracks = dmgG ? dmgG.querySelectorAll('path') : [];
  var BREACH = cracks.length;                 // hits needed to bring the wall down
  var WALL = { x0:228, x1:314, y0:106, y1:218 };
  // Sweep matches the idle keyframes exactly, or the machine would flip
  // direction the instant you started playing.
  var COCK = -35, FIRE = 115, SWING = -190;
  var GROUND = 216, GRAV = 0.11;
  var REL_T = 5, GAIN = 0.14;   // tuned by simulation: low power falls
                                // short, mid band hits, full power sails over
  function rotp(px,py,cx,cy,deg){
    var r=deg*Math.PI/180, c=Math.cos(r), sn=Math.sin(r), dx=px-cx, dy=py-cy;
    return [cx+dx*c-dy*sn, cy+dx*sn+dy*c];
  }
  // Where the sling pouch actually is: rotate it about the arm tip, then
  // rotate that about the main pivot. Previously the stone was spawned at a
  // hardcoded point that had nothing to do with the arm, so it teleported.
  function pouchAt(a,sA){
    var q = rotp(48,129, 60,96, sA);
    return rotp(q[0],q[1], 155,104, a);
  }
  function angAt(tt){ var k=Math.min(1,tt/11); return COCK+(FIRE-COCK)*(k*k*(3-2*k)); }
  function sAt(tt){ return SWING*Math.min(1,tt/13); }

  var on=false, charging=false, power=0, phase='ready', t=0,
      shots=0, hits=0, dmg=0,
      best = parseInt(localStorage.getItem('fr_siege_best')||'0', 10),
      p=null, raf=null, idleAt=Date.now();

  function draw(){
    var ang, sAng;
    if (phase==='ready' || phase==='charging'){
      ang  = COCK - power*7;                  // creaks further back under load
      sAng = power*5;
    } else if (phase==='throw'){
      ang  = angAt(t); sAng = sAt(t);
    } else {                                   // spent, arm over the top
      ang = FIRE; sAng = SWING;
    }
    // CSS transforms, not SVG attributes: the pivot must come from
    // transform-origin alone, never from rotate()'s own cx/cy as well.
    beam.style.transform  = 'rotate(' + ang.toFixed(2) + 'deg)';
    cw.style.transform    = 'rotate(' + (-ang).toFixed(2) + 'deg)';   // hangs plumb
    sling.style.transform = 'rotate(' + sAng.toFixed(2) + 'deg)';
    // Before release the stone sits in the sling; after, it flies.
    var q = p ? [p.x,p.y] : pouchAt(ang,sAng);
    shot.style.opacity = 1;
    shot.style.transform =
      'translate(' + (q[0]-46).toFixed(1) + 'px,' + (q[1]-106).toFixed(1) + 'px)';
  }

  function hudText(){
    hud.innerHTML = on
      ? 'shots <b>'+shots+'</b> · hits <b>'+hits+'</b> · wall <b>'+Math.max(0,BREACH-dmg)+'</b>'
        + (best?' · best <b>'+best+'</b>':'')
      : '';
  }

  function burst(x,y){
    hitG.style.animation='none';
    hitG.setAttribute('transform','translate('+(x-258)+','+(y-150)+')');
    hitG.style.opacity=1; hitG.style.transform='scale(1)';
    setTimeout(function(){ hitG.style.transition='opacity .45s, transform .45s';
      hitG.style.opacity=0; hitG.style.transform='scale(2.1)'; }, 20);
    setTimeout(function(){ hitG.style.transition=''; }, 500);
    if (shake){ shake.style.animation='none'; void shake.offsetWidth;
      shake.style.animation='shake .55s linear'; }
  }

  function land(hit,x,y){
    shots++;
    if (hit){
      hits++;
      if (dmg < BREACH){ cracks[dmg].style.transition='opacity .35s'; cracks[dmg].style.opacity=.95; dmg++; }
      burst(x,y);
      if (dmg >= BREACH){
        if (hits > best || best===0){ best = hits; try{ localStorage.setItem('fr_siege_best', best); }catch(e){} }
        setTimeout(reset, 1400);
      }
    }
    p=null; phase='spent'; hudText();
    setTimeout(function(){ if(on && phase==='spent'){ phase='ready'; t=0; power=0; draw(); } }, 700);
  }

  function reset(){
    dmg=0; hits=0; shots=0;
    for (var i=0;i<cracks.length;i++) cracks[i].style.opacity=0;
    hudText();
  }

  function loop(){
    if (!on) return;
    if (phase==='charging'){
      power = Math.min(1, power + 0.017);
      fill.style.width = (power*100).toFixed(0)+'%';
    }
    if (phase==='throw'){
      // A harder wind swings the arm faster, so release speed comes out of
      // the geometry rather than being a separate made-up number.
      var prevQ = pouchAt(angAt(t), sAt(t));
      t += 0.55 + 0.85*power;
      if (!p && t >= REL_T){
        var q = pouchAt(angAt(t), sAt(t));
        p = { x:q[0], y:q[1],
              vx:(q[0]-prevQ[0])*GAIN, vy:(q[1]-prevQ[1])*GAIN };
      }
      if (t>34 && !p){ phase='spent'; setTimeout(function(){ if(on){phase='ready';t=0;power=0;} },600); }
    }
    if (p){
      p.x += p.vx; p.y += p.vy; p.vy += GRAV;
      var inWall = p.x>=WALL.x0 && p.x<=WALL.x1 && p.y>=WALL.y0 && p.y<=WALL.y1;
      var gone   = p.y >= GROUND || p.x > 402;
      if (inWall || gone) land(inWall, p.x, p.y);
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  function arm(){
    if (on) return;
    on = true; stage.classList.add('playing');
    hint.textContent = PLAY; hint.classList.add('on');
    phase='ready'; t=0; power=0; p=null; reset(); draw();
    raf = requestAnimationFrame(loop);
  }
  function disarm(){
    on=false; charging=false; phase='ready'; p=null;
    cancelAnimationFrame(raf);
    stage.classList.remove('playing');
    [beam, cw, sling, shot].forEach(function(el){ el.style.transform = ''; });
    shot.style.opacity=''; hitG.style.opacity=''; hitG.style.transform=''; hitG.style.animation='';
    for (var i=0;i<cracks.length;i++) cracks[i].style.opacity=0;
    hud.innerHTML=''; meter.classList.remove('on'); idleAt=Date.now();
    hint.textContent = TAKE;
  }

  function press(){
    if (!on) { arm(); return; }
    if (phase!=='ready') return;
    charging=true; phase='charging'; power=0;
    meter.classList.add('on'); fill.style.width='0%';
  }
  function release(){
    if (!on || phase!=='charging') return;
    charging=false; phase='throw'; t=0; meter.classList.remove('on');
  }

  addEventListener('keydown', function(e){
    if (e.code==='Space'){ e.preventDefault(); if(!e.repeat) press(); }
    if (e.code==='Escape' && on) disarm();
  });
  addEventListener('keyup', function(e){ if (e.code==='Space'){ e.preventDefault(); release(); } });
  stage.addEventListener('pointerdown', function(e){ e.preventDefault(); press(); });
  addEventListener('pointerup', release);

  if (quit) quit.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation(); disarm();
  });

  stage.classList.add('armable');
  hint.textContent = TAKE;
  // Plain timer, not an idle timer. The parallax means the pointer is
  // almost always moving, so an idle gate never fired on desktop.
  setTimeout(function(){ hint.classList.add('on'); }, 3500);
})();
</script>
</body>
