<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Royale — Under Siege</title>
<meta name="description" content="Fact Royale is temporarily unavailable.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Fact Royale — Under Siege">
<meta property="og:description" content="We're having trouble. The keep is holding.">
<style>
:root{
  --gold:#d4af37; --gold-lt:#f5dd8f; --gold-dk:#8a7024;
  --flame:#f0a92a; --flame-hot:#ffd77a; --muted:#8b88a0;
  --timber:#4a3822; --timber-lt:#6b5231; --timber-dk:#2e2315;
  --iron:#5a5a6e; --stone-a:#232336; --stone-b:#1b1b2b; --stone-c:#2b2b40;
  --mx:0; --my:0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#05050b; color:#eceaf3; overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;padding:16px;
}
.stage{perspective:1250px;perspective-origin:50% 48%;
  width:min(900px,97vw);height:min(400px,50vh);position:relative;margin-bottom:4px}
.world{position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateY(calc(var(--mx) * 6deg)) rotateX(calc(var(--my) * -2.2deg));
  transition:transform .4s cubic-bezier(.2,.7,.3,1)}
.layer{position:absolute;inset:0;transform-style:preserve-3d}
.layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.z-sky{transform:translateZ(-820px) scale(1.68)}
.z-moon{transform:translateZ(-660px) scale(1.55)}
.z-hills{transform:translateZ(-500px) scale(1.42)}
.z-keep{transform:translateZ(-360px) scale(1.30)}
.z-fog1{transform:translateZ(-250px) scale(1.21)}
.z-wall{transform:translateZ(-100px) scale(1.08)}
.z-treb{transform:translateZ(50px) scale(.96)}
.z-camp{transform:translateZ(170px) scale(.86)}
.z-fore{transform:translateZ(300px) scale(.76)}

/* ── siege cycle, 6.4s. every part keyed to the same clock ── */
@keyframes beam{
  0%,10%{transform:rotate(-35deg)}
  18%{transform:rotate(126deg)}
  23%{transform:rotate(107deg)}
  28%{transform:rotate(120deg)}
  33%{transform:rotate(111deg)}
  38%{transform:rotate(117deg)}
  46%{transform:rotate(115deg)}
  62%{transform:rotate(115deg)}
  94%,100%{transform:rotate(-35deg)}
}
.beam{transform-origin:155px 104px;animation:beam 6.4s cubic-bezier(.5,0,.35,1) infinite}

/* counterweight hangs true: counter-rotates against the beam */
@keyframes cw{
  0%,10%{transform:rotate(35deg)}
  18%{transform:rotate(-134deg)}
  23%{transform:rotate(-100deg)}
  28%{transform:rotate(-124deg)}
  33%{transform:rotate(-108deg)}
  38%{transform:rotate(-119deg)}
  46%{transform:rotate(-115deg)}
  62%{transform:rotate(-115deg)}
  94%,100%{transform:rotate(35deg)}
}
.cw{transform-origin:196px 118px;animation:cw 6.4s cubic-bezier(.5,0,.35,1) infinite}

/* sling trails, then whips past the beam and lets go */
@keyframes sling{
  0%,10%{transform:rotate(0deg)}
  16%{transform:rotate(-62deg)}
  19%{transform:rotate(-128deg)}
  22%{transform:rotate(-172deg);opacity:1}
  26%{transform:rotate(-202deg);opacity:.85}
  34%{transform:rotate(-180deg);opacity:.85}
  48%{transform:rotate(-192deg);opacity:.85}
  62%{transform:rotate(-192deg);opacity:.85}
  94%,100%{transform:rotate(0deg);opacity:1}
}
.sling{transform-origin:60px 96px;animation:sling 6.4s cubic-bezier(.5,0,.35,1) infinite}

/* frame recoils and rolls back, then is winched forward again */
@keyframes recoil{
  0%,12%{transform:translateX(0)}
  20%{transform:translateX(7px)}
  26%{transform:translateX(9px)}
  60%{transform:translateX(9px)}
  92%,100%{transform:translateX(0)}
}
.rig{animation:recoil 6.4s ease-out infinite}

@keyframes shot{
  0%,19%{transform:translate(114px,-61px);opacity:0}
  20%{opacity:1}
  26%{transform:translate(150px,-72px)}
  32%{transform:translate(186px,-66px)}
  38%{transform:translate(214px,-44px)}
  43%{transform:translate(230px,-8px)}
  45%{transform:translate(236px,20px);opacity:1}
  47%{transform:translate(238px,30px);opacity:0}
  100%{opacity:0}
}
.shot{animation:shot 6.4s cubic-bezier(.35,0,.7,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shot-spin{transform-origin:46px 106px;animation:spin 1.1s linear infinite}

@keyframes hit{0%,44%{opacity:0;transform:scale(.3)}47%{opacity:1;transform:scale(1)}
  60%{opacity:0;transform:scale(2.1)}100%{opacity:0}}
.hit{transform-origin:258px 150px;animation:hit 6.4s ease-out infinite}
@keyframes hit2{0%,45%{opacity:0}48%{opacity:.9}56%{opacity:0}100%{opacity:0}}
.spark{animation:hit2 6.4s ease-out infinite}

@keyframes shake{0%,44%{transform:translate(0,0)}47%{transform:translate(-3px,2px)}
  50%{transform:translate(2.5px,-1.5px)}53%{transform:translate(-1.5px,1px)}
  56%{transform:translate(.7px,-.4px)}59%,100%{transform:translate(0,0)}}
.shake{animation:shake 6.4s linear infinite}

/* Heavier shake, used only when the whole span comes down. */
@keyframes quake{0%{transform:translate(0,0)}
  12%{transform:translate(-6px,3px)}25%{transform:translate(5px,-3px)}
  38%{transform:translate(-4.5px,2px)}52%{transform:translate(3.5px,-2px)}
  66%{transform:translate(-2.5px,1.4px)}80%{transform:translate(1.4px,-.8px)}
  100%{transform:translate(0,0)}}

/* transform-box:fill-box makes transform-origin resolve against the element's
   own bounding box rather than the SVG user-space origin. Without it a
   percentage origin lands at the top-left of the whole 400x250 viewBox and
   every rotation swings the piece across the scene. */
#gWall{transform-box:fill-box;transform-origin:0% 100%}
#gPieces path{transform-box:fill-box;transform-origin:50% 50%}
#gDust ellipse{transform-box:fill-box;transform-origin:50% 100%}

@keyframes rubble{0%,45%{opacity:0;transform:translate(0,0) rotate(0)}
  50%{opacity:.85}88%{opacity:0;transform:translate(-22px,26px) rotate(150deg)}100%{opacity:0}}
.rubble{animation:rubble 6.4s ease-in infinite}
.r2{animation-delay:.1s}.r3{animation-delay:.2s}.r4{animation-delay:.3s}

/* winch turning while the crew re-cocks */
@keyframes winch{0%,62%{transform:rotate(0)}92%,100%{transform:rotate(-540deg)}}
.winch{transform-origin:186px 200px;animation:winch 6.4s ease-in-out infinite}

@keyframes flick{0%,100%{opacity:.9;transform:scale(1) translateY(0)}
  40%{opacity:.55;transform:scale(.85) translateY(1px)}
  70%{opacity:1;transform:scale(1.12) translateY(-1px)}}
.flame{transform-origin:bottom center;animation:flick 1.5s ease-in-out infinite}
.f2{animation-delay:.4s}.f3{animation-delay:.8s}.f4{animation-delay:1.1s}

@keyframes ripple{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(3.4deg) scaleX(.92)}}
.banner{animation:ripple 3.4s ease-in-out infinite}
.bn2{animation-duration:4.1s;animation-delay:.7s}
.bn3{animation-duration:3.7s;animation-delay:1.4s}

@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.9}
  100%{transform:translateY(-120px) scale(1.1);opacity:0}}
.ember{animation:rise 4.6s ease-out infinite}
.e2{animation-duration:5.9s;animation-delay:.9s}
.e3{animation-duration:4.1s;animation-delay:1.9s}
.e4{animation-duration:6.3s;animation-delay:2.8s}
.e5{animation-duration:5.2s;animation-delay:3.6s}
.e6{animation-duration:4.8s;animation-delay:1.3s}

@keyframes smoke{0%{transform:translateY(0) scale(.7);opacity:0}
  25%{opacity:.22}100%{transform:translateY(-70px) scale(2.1);opacity:0}}
.smoke{animation:smoke 7s ease-out infinite}
.s2{animation-delay:2.3s}.s3{animation-delay:4.6s}

@keyframes drift{0%{transform:translateX(-7%)}100%{transform:translateX(7%)}}
.fog{animation:drift 28s ease-in-out infinite alternate}
.fog2{animation-duration:21s;animation-direction:alternate-reverse}
@keyframes cloud{0%{transform:translateX(-40px)}100%{transform:translateX(430px)}}
.cloud{animation:cloud 64s linear infinite}
.cl2{animation-duration:88s;animation-delay:-30s}

@keyframes twinkle{0%,100%{opacity:.22}50%{opacity:.85}}
.star{animation:twinkle 4s ease-in-out infinite}

@keyframes pace{0%,100%{transform:translateX(0)}50%{transform:translateX(13px)}}
.pace{animation:pace 9s ease-in-out infinite}
.pace2{animation-duration:11s;animation-direction:reverse}

/* ── hidden siege game ──────────────────────────────────
   Taking the trebuchet stops the idle loop and hands the mechanism to JS.
   The CSS animations and the game drive the same transforms, so only one of
   them may be running at a time. */
.playing .beam,.playing .cw,.playing .sling,.playing .shot,
.playing .rig,.playing .winch{animation:none!important}
.stage{cursor:default;
  /* A long press on a phone otherwise selects text, pops the callout menu, or
     scrolls the page instead of winding the counterweight. */
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.stage.armable{cursor:crosshair}
.quit{position:absolute;top:4px;left:8px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:#4e4c60;border:1px solid #2c2c44;border-radius:4px;
  padding:4px 9px;display:none;cursor:pointer;background:#0f0f1c;pointer-events:auto}
.playing .quit{display:block}
.quit:hover{color:var(--gold);border-color:var(--gold-dk)}
.hud{position:absolute;top:6px;right:10px;font-size:11px;letter-spacing:.14em;
  color:#4e4c60;text-transform:uppercase;pointer-events:none;transition:color .3s}
.playing .hud{color:#7c7892}
.hud b{color:var(--gold);font-weight:600}
.meter{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  width:168px;height:5px;background:#16162a;border:1px solid #2c2c44;border-radius:3px;
  opacity:0;transition:opacity .18s;pointer-events:none;overflow:hidden}
.meter.on{opacity:1}
.meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--flame),var(--flame-hot))}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  font-size:11.5px;letter-spacing:.1em;color:#3a3849;text-transform:uppercase;
  opacity:0;transition:opacity 1.1s,color .3s;pointer-events:none;white-space:nowrap;
  text-align:center;max-width:94%}
.hint.on{opacity:1}
.playing .hint{opacity:1;color:#56546a}
@media(max-height:560px){
  .stage{height:min(300px,44vh)}
  h1{font-size:clamp(24px,5vw,34px);margin:6px 0 4px}
  .tiny{margin-top:10px}
}
h1{font-size:clamp(30px,6vw,50px);margin:10px 0 8px;color:var(--gold-lt);
  letter-spacing:.02em;font-weight:700;text-align:center;
  text-shadow:0 0 36px rgba(212,175,55,.3)}
.line{color:var(--muted);font-size:clamp(15px,2.1vw,17px);text-align:center;margin:0;max-width:36ch}
.tiny{color:#5f5d70;font-size:12.5px;margin-top:18px;text-align:center;letter-spacing:.03em}
.tiny a{color:#7a7690;text-decoration:none;border-bottom:1px solid #34324a}
.tiny a:hover{color:var(--gold)}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
  .world{transform:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="stage">
 <div class="world">

  <div class="layer z-sky"><svg viewBox="0 0 400 250" aria-hidden="true">
    <defs>
      <radialGradient id="night" cx="50%" cy="88%" r="76%">
        <stop offset="0%" stop-color="#191932"/><stop offset="100%" stop-color="#08080f"/>
      </radialGradient>
    </defs>
    <rect width="400" height="250" fill="url(#night)"/>
    <g fill="#d6d1ee">
      <circle class="star" cx="34" cy="30" r="1.1"/><circle class="star" cx="92" cy="16" r=".8" style="animation-delay:1.2s"/>
      <circle class="star" cx="148" cy="38" r="1.2" style="animation-delay:2.1s"/><circle class="star" cx="212" cy="14" r=".9" style="animation-delay:.6s"/>
      <circle class="star" cx="266" cy="34" r="1.1" style="animation-delay:2.8s"/><circle class="star" cx="358" cy="22" r="1" style="animation-delay:3.5s"/>
      <circle class="star" cx="62" cy="58" r=".8" style="animation-delay:3.4s"/><circle class="star" cx="182" cy="62" r=".7" style="animation-delay:1.7s"/>
      <circle class="star" cx="298" cy="60" r=".9" style="animation-delay:2.4s"/><circle class="star" cx="126" cy="8" r=".7" style="animation-delay:4.1s"/>
      <circle class="star" cx="242" cy="52" r=".8" style="animation-delay:.9s"/><circle class="star" cx="380" cy="52" r=".8" style="animation-delay:3.1s"/>
    </g>
  </svg></div>

  <div class="layer z-moon"><svg viewBox="0 0 400 250" aria-hidden="true">
    <circle cx="250" cy="72" r="27" fill="#20203a" opacity=".8"/>
    <circle cx="250" cy="72" r="20" fill="#ece7cd"/>
    <circle cx="241" cy="66" r="3.6" fill="#d3cdae" opacity=".6"/>
    <circle cx="256" cy="78" r="4.8" fill="#d3cdae" opacity=".5"/>
    <circle cx="258" cy="64" r="2.4" fill="#d3cdae" opacity=".55"/>
    <circle cx="245" cy="80" r="2" fill="#d3cdae" opacity=".45"/>
    <g fill="#0e0e1c" opacity=".62">
      <ellipse class="cloud" cx="-20" cy="40" rx="34" ry="6"/>
      <ellipse class="cloud cl2" cx="-40" cy="58" rx="46" ry="5"/>
    </g>
  </svg></div>

  <div class="layer z-hills"><svg viewBox="0 0 400 250" aria-hidden="true">
    <path d="M0,178 L46,150 L88,168 L132,138 L186,166 L232,148 L286,172 L340,146 L400,170 L400,250 L0,250 Z" fill="#0d0d1a"/>
    <g fill="#0a0a15">
      <path d="M20,176 l4,-12 l4,12 Z"/><path d="M60,168 l5,-14 l5,14 Z"/>
      <path d="M348,162 l4,-11 l4,11 Z"/><path d="M372,166 l5,-13 l5,13 Z"/>
    </g>
  </svg></div>

  <div class="layer z-keep"><svg viewBox="0 0 400 250" aria-hidden="true">
    <g fill="#101020">
      <rect x="298" y="74" width="90" height="144"/>
      <rect x="294" y="66" width="98" height="10"/>
      <rect x="296" y="56" width="11" height="11"/><rect x="318" y="56" width="11" height="11"/>
      <rect x="340" y="56" width="11" height="11"/><rect x="362" y="56" width="11" height="11"/>
      <rect x="381" y="56" width="11" height="11"/>
      <path d="M330,42 L346,42 L338,26 Z"/>
      <rect x="336" y="100" width="5" height="16" fill="#f0a92a" opacity=".5"/>
      <rect x="358" y="128" width="5" height="16" fill="#f0a92a" opacity=".35"/>
      <rect x="312" y="150" width="5" height="16" fill="#f0a92a" opacity=".4"/>
      <rect x="14" y="140" width="52" height="78"/>
      <rect x="10" y="132" width="60" height="9"/>
      <rect x="12" y="122" width="10" height="10"/><rect x="34" y="122" width="10" height="10"/>
      <rect x="56" y="122" width="10" height="10"/>
      <rect x="36" y="156" width="5" height="14" fill="#f0a92a" opacity=".3"/>
    </g>
    <g class="banner bn3"><path d="M338,26 L338,10 L362,16 L338,22 Z" fill="#5b2a86" opacity=".85"/></g>
  </svg></div>

  <div class="layer z-fog1"><svg viewBox="0 0 400 250" aria-hidden="true">
    <ellipse class="fog" cx="200" cy="192" rx="240" ry="28" fill="#141426" opacity=".55"/>
  </svg></div>

  <div class="layer z-wall"><svg viewBox="0 0 400 250" aria-hidden="true">
    <defs>
      <pattern id="mason" width="16" height="9" patternUnits="userSpaceOnUse">
        <rect width="16" height="9" fill="var(--stone-b)"/>
        <rect width="15" height="8" fill="var(--stone-a)"/>
        <rect x="8" y="4.5" width="15" height="8" fill="var(--stone-c)" opacity=".55"/>
      </pattern>
    </defs>
    <g class="shake" id="gShake">
      <!-- Everything inside gWall is the standing wall and topples as one
           piece. Debris, dust and the rubble pile sit OUTSIDE it, so they
           stay put while the wall goes over. -->
      <g id="gWall">
        <!-- The wall face, parapet and merlons are one lattice of irregular
             blocks, generated per rebuild. These same blocks ARE the standing
             wall, the knocked-out debris and the final rubble pile: one set of
             objects in three states, so the wall and its wreckage can never
             disagree about where the stone went. -->
        <g id="gPieces" fill="url(#mason)"></g>

        <!-- Painted detail. Not physical. Fades out when the span goes, so the
             gate does not hang in mid-air over a heap of rubble. -->
        <g id="gTrim">
          <rect x="252" y="170" width="26" height="48" fill="#0b0b16"/>
          <path d="M252,170 a13,13 0 0 1 26,0" fill="#0b0b16"/>
          <g stroke="var(--iron)" stroke-width="1.4" opacity=".8">
            <line x1="256" y1="174" x2="256" y2="218"/><line x1="262" y1="170" x2="262" y2="218"/>
            <line x1="268" y1="170" x2="268" y2="218"/><line x1="274" y1="174" x2="274" y2="218"/>
            <line x1="252" y1="184" x2="278" y2="184"/><line x1="252" y1="198" x2="278" y2="198"/>
          </g>
          <g id="gSlits" fill="#07070f"></g>
          <g id="gPace" fill="#0a0a14">
            <path class="pace" d="M238,104 h4 v-7 a2,2 0 0 0 -4,0 Z"/>
            <path class="pace pace2" d="M288,104 h4 v-7 a2,2 0 0 0 -4,0 Z"/>
            <path d="M262,104 h4 v-7 a2,2 0 0 0 -4,0 Z"/>
            <line x1="264" y1="97" x2="264" y2="86" stroke="#0a0a14" stroke-width="1.4"/>
          </g>
          <!-- Damage cracks only. The wall no longer ships pre-cracked: it
               starts sound and every mark on it is one you put there. -->
          <g id="gDmg" stroke="#06060d" stroke-width="2.6" fill="none">
            <path d="M244,124 L254,134 L246,146" opacity="0"/>
            <path d="M286,116 L278,128 L288,138" opacity="0"/>
            <path d="M234,158 L246,166 L238,180" opacity="0"/>
            <path d="M296,150 L288,162 L300,172" opacity="0"/>
            <path d="M258,120 L266,136 L256,150 L268,162" opacity="0" stroke-width="3.4"/>
            <path d="M240,190 L256,196 L272,190 L290,198" opacity="0" stroke-width="3.4"/>
          </g>
          <g fill="#39394f">
            <rect class="rubble"    x="252" y="152" width="4" height="4"/>
            <rect class="rubble r2" x="261" y="156" width="3.4" height="3.4"/>
            <rect class="rubble r3" x="248" y="160" width="3" height="3"/>
            <rect class="rubble r4" x="264" y="148" width="2.6" height="2.6"/>
          </g>
        </g>
      </g>

      <g id="gDust" fill="#2a2a3c">
        <ellipse cx="248" cy="216" rx="20" ry="9" opacity="0"/>
        <ellipse cx="274" cy="216" rx="24" ry="11" opacity="0"/>
        <ellipse cx="296" cy="216" rx="18" ry="8" opacity="0"/>
      </g>

      <g class="hit" id="gHit">
        <circle cx="258" cy="150" r="10" fill="none" stroke="var(--flame-hot)" stroke-width="2.6"/>
        <circle cx="258" cy="150" r="4" fill="var(--flame-hot)"/>
      </g>
      <g class="spark" stroke="var(--flame-hot)" stroke-width="1.6" stroke-linecap="round">
        <line x1="258" y1="150" x2="246" y2="140"/><line x1="258" y1="150" x2="272" y2="142"/>
        <line x1="258" y1="150" x2="250" y2="163"/><line x1="258" y1="150" x2="270" y2="162"/>
      </g>
    </g>
  </svg></div>

  <div class="layer z-treb"><svg viewBox="0 0 400 250" aria-hidden="true">
    <!-- The machine was drawn at a scale that left its swept arm 6px from the
         wall, so it threw a stone a shorter distance than its own length. This
         wrapper stands it off and shrinks it; the standard travels with it so
         the composition of machine-and-banner is unchanged, just smaller.
         The transform lives here and not on .rig, because .rig carries the
         recoil animation and a CSS transform would override the attribute.
         Physics stays in this group's local space: see RIG_S in the script. -->
    <g id="gRigScale" transform="translate(6.5,64.2) scale(0.7)">
    <g class="rig">
      <g fill="var(--timber)" stroke="var(--timber-dk)" stroke-width="1">
        <rect x="98" y="206" width="118" height="8" rx="1.5"/>
        <rect x="104" y="196" width="8" height="12"/><rect x="200" y="196" width="8" height="12"/>
      </g>
      <g stroke="var(--iron)" stroke-width="1.6" fill="#1a1a26">
        <circle cx="112" cy="214" r="8"/><circle cx="204" cy="214" r="8"/>
        <circle cx="112" cy="214" r="2.2" fill="var(--iron)"/><circle cx="204" cy="214" r="2.2" fill="var(--iron)"/>
        <line x1="106" y1="209" x2="118" y2="219"/><line x1="118" y1="209" x2="106" y2="219"/>
        <line x1="198" y1="209" x2="210" y2="219"/><line x1="210" y1="209" x2="198" y2="219"/>
      </g>
      <g stroke="var(--timber-lt)" stroke-width="5" stroke-linecap="round" fill="none">
        <line x1="118" y1="206" x2="155" y2="104"/>
        <line x1="192" y1="206" x2="155" y2="104"/>
      </g>
      <g stroke="var(--timber)" stroke-width="3.4" stroke-linecap="round" fill="none">
        <line x1="133" y1="164" x2="177" y2="164"/>
        <line x1="133" y1="164" x2="177" y2="128"/>
        <line x1="177" y1="164" x2="133" y2="128"/>

<script>
(function(){
  var root = document.documentElement;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tx=0, ty=0, cx=0, cy=0, drift=0, raf;
  function tick(){
    cx += (tx-cx)*0.06; cy += (ty-cy)*0.06; drift += 0.003;
    root.style.setProperty('--mx', (cx + Math.sin(drift)*0.2).toFixed(4));
    root.style.setProperty('--my', cy.toFixed(4));
    raf = requestAnimationFrame(tick);
  }
  tick();
  addEventListener('pointermove', function(e){
    tx = (e.clientX/innerWidth - .5)*2; ty = (e.clientY/innerHeight - .5)*2;
  }, {passive:true});
  addEventListener('pointerleave', function(){ tx=0; ty=0; }, {passive:true});
  addEventListener('deviceorientation', function(e){
    // iOS returns null here until permission is granted; we never prompt.
    if (e.gamma == null) return;
    tx = Math.max(-1, Math.min(1, e.gamma/30));
    ty = Math.max(-1, Math.min(1, ((e.beta||45)-45)/30));
  }, {passive:true});
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(tick);
  });
})();

// ── The siege, playable ────────────────────────────────────────────────
// Hold to wind the counterweight, release to loose. Same mechanism the idle
// loop drives, handed over to physics. Discovered rather than advertised —
// the hint only appears if you have been sitting here a while.
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var stage = document.querySelector('.stage'),
      beam  = document.getElementById('gBeam'), cw    = document.getElementById('gCw'),
      sling = document.getElementById('gSling'), shot = document.getElementById('gShot'),
      shake = document.getElementById('gShake'), hitG = document.getElementById('gHit'),
      dmgG  = document.getElementById('gDmg'),
      wallG = document.getElementById('gWall'),   piecesG = document.getElementById('gPieces'),
      trimG = document.getElementById('gTrim'),   dustG   = document.getElementById('gDust'),
      slitsG= document.getElementById('gSlits'),
      hud   = document.getElementById('hud'), meter = document.getElementById('meter'),
      fill  = document.getElementById('meterFill'), hint = document.getElementById('hint'),
      quit  = document.getElementById('quit');
  if (!beam || !stage) return;

  // Touch devices get different words and an on-screen exit, because there is
  // no space bar and no Escape key to tell them about.
  var TOUCH = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  var TAKE  = TOUCH ? 'touch and hold the trebuchet' : 'hold space to take the trebuchet';
  var PLAY  = TOUCH ? 'hold to wind  ·  release to loose'
                    : 'hold to wind  ·  release to loose  ·  esc to stand down';

  var cracks = dmgG  ? dmgG.querySelectorAll('path')     : [];
  var dust   = dustG ? dustG.querySelectorAll('ellipse') : [];

  // Three stages, escalating. Stone spiders first, then blocks come out and
  // leave real voids, then the span fails. A wall that simply blinks back to
  // new gives the player nothing to read; this way the damage is a story.
  var CRACK_HITS = 3;
  var CHUNK_HITS = 4;                         // hits that punch blocks out
  var BREACH = CRACK_HITS + CHUNK_HITS + 1;   // the last hit brings it down

  var WALL = { x0:228, x1:314, y0:106, y1:218 };
  var SPAN_X0 = 228, SPAN_X1 = 314, BASE_Y = 218;
  var GATE_X0 = 252, GATE_X1 = 278;
  var NS = 'http://www.w3.org/2000/svg';

  // Debris physics. The previous version animated chunks with CSS transitions
  // that faded to zero opacity over the same duration as the movement, so a
  // block dissolved in mid-air instead of landing. These are real particles
  // stepped by the same animation loop as the projectile: they accelerate,
  // bounce, lose energy and come to rest, and where they rest becomes the
  // rubble pile. Nothing fades.
  var PIECES = [];            // {el,cx,cy,x,y,vx,vy,rot,vr,state,delay}
  // Halved the speed of the whole collapse: gravity scales with the square of
  // the time factor and the launch velocities with the factor itself, so the
  // trajectories keep their shape and only the clock changes. The first pass
  // put the wall down in 0.9s, which read as a puff rather than a fall.
  var D_GRAV = 0.11, BOUNCE = -0.30, FRICTION = 0.62, SLEEP_V = 0.55;

  // The heap is tracked in buckets across the ground. The span is wider than
  // the wall on purpose: debris is thrown out past the left edge, and when the
  // buckets only covered the wall itself everything that flew clear clamped
  // into bucket zero and stacked 52px into a tower. PILE_MAX caps it too.
  var BUCKETS = 18, PILE_STEP = 2.2, pileTop = [];
  var PILE_X0 = 186, PILE_X1 = 322, PILE_MAX = 15;

  function rnd(a,b){ return a + Math.random()*(b-a); }
  function rndInt(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }
  function clearKids(el){ while (el && el.firstChild) el.removeChild(el.firstChild); }
  function bucketOf(x){
    var b = Math.floor((x - PILE_X0) / (PILE_X1 - PILE_X0) * BUCKETS);
    return b < 0 ? 0 : b >= BUCKETS ? BUCKETS-1 : b;
  }
  function dropPile(b, amt){
    pileTop[b] = Math.max(BASE_Y - PILE_MAX, pileTop[b] - amt);
  }
  // Sweep matches the idle keyframes exactly, or the machine would flip
  // direction the instant you started playing.
  var COCK = -35, FIRE = 115, SWING = -190;
  var GROUND = 216, GRAV = 0.11;

  // Retuned by simulation. The arm used to cross its whole 150 degree sweep
  // in about 8 frames at full wind, which is 19 degrees a frame: that was the
  // choppiness. SWEEP now stretches the same arc over roughly 35 frames.
  //
  // Release was at 45% of the sweep with the arm still at 29 degrees, low and
  // rising, which is why the stone left before the machine had come forward.
  // 62% puts the arm at 66 degrees and throwing. Past about 72% the launch
  // vector tips downward again, so later is not better.
  var SWEEP = 40, SLING_SWEEP = 45;
  var WIND_BASE = 0.30, WIND_GAIN = 0.75;   // t per frame = base + gain*power

  // The machine is drawn inside #gRigScale, so everything the arm does happens
  // in that group's local space. The projectile is integrated in the same
  // space (it is parented there too, which is why it renders correctly without
  // conversion) and is mapped to scene coordinates only for the collision
  // test. Keeping ONE conversion point means the stone the player sees and the
  // stone the wall is tested against can never be two different stones.
  // One owner: the transform lives in the markup, because this script returns
  // early under prefers-reduced-motion and the scene still has to be laid out
  // correctly for those readers. The physics reads the attribute back instead
  // of keeping a second copy of the numbers that can drift away from it.
  var RIG_S = 0.70, RIG_TX = 6.5, RIG_TY = 64.2;
  (function(){
    var el = document.getElementById('gRigScale');
    if (!el) return;
    var m = /translate\(\s*(-?[\d.]+)[\s,]+(-?[\d.]+)\s*\)\s*scale\(\s*(-?[\d.]+)/
              .exec(el.getAttribute('transform') || '');
    if (m){ RIG_TX = parseFloat(m[1]); RIG_TY = parseFloat(m[2]); RIG_S = parseFloat(m[3]); }
  })();
  function toSceneX(x){ return RIG_S*x + RIG_TX; }
  function toSceneY(y){ return RIG_S*y + RIG_TY; }

  // Standing the machine off from 73px to 113px more than doubled the range it
  // has to cover in its own local units, so the release retuned with it.
  var REL_T = 0.58 * SWEEP, GAIN = 0.78;
  function rotp(px,py,cx,cy,deg){
    var r=deg*Math.PI/180, c=Math.cos(r), sn=Math.sin(r), dx=px-cx, dy=py-cy;
    return [cx+dx*c-dy*sn, cy+dx*sn+dy*c];
  }
  // Where the sling pouch actually is: rotate it about the arm tip, then
  // rotate that about the main pivot. Previously the stone was spawned at a
  // hardcoded point that had nothing to do with the arm, so it teleported.
  function pouchAt(a,sA){
    var q = rotp(48,129, 60,96, sA);
    return rotp(q[0],q[1], 155,104, a);
  }
  function angAt(tt){ var k=Math.min(1,tt/SWEEP); return COCK+(FIRE-COCK)*(k*k*(3-2*k)); }
  function sAt(tt){ return SWING*Math.min(1,tt/SLING_SWEEP); }

  var on=false, charging=false, power=0, phase='ready', t=0, falling=false,
      shots=0, hits=0, dmg=0,
      best = parseInt(localStorage.getItem('fr_siege_best')||'0', 10),
      p=null, raf=null, idleAt=Date.now();

  function draw(){
    var ang, sAng;
    if (phase==='ready' || phase==='charging'){
      ang  = COCK - power*7;                  // creaks further back under load
      sAng = power*5;
    } else if (phase==='throw'){
      ang  = angAt(t); sAng = sAt(t);
    } else {
      // Spent. Let the arm keep running out its own sweep rather than being
      // snapped to the end pose. At low wind the stone lands while the arm is
      // only part way round, and jumping it to FIRE was a visible flick right
      // at the moment the player was watching the shot.
      ang = angAt(t); sAng = sAt(t);
    }
    // CSS transforms, not SVG attributes: the pivot must come from
    // transform-origin alone, never from rotate()'s own cx/cy as well.
    beam.style.transform  = 'rotate(' + ang.toFixed(2) + 'deg)';
    cw.style.transform    = 'rotate(' + (-ang).toFixed(2) + 'deg)';   // hangs plumb
    sling.style.transform = 'rotate(' + sAng.toFixed(2) + 'deg)';
    // Before release the stone sits in the sling; after, it flies.
    var q = p ? [p.x,p.y] : pouchAt(ang,sAng);
    shot.style.opacity = 1;
    shot.style.transform =
      'translate(' + (q[0]-46).toFixed(1) + 'px,' + (q[1]-106).toFixed(1) + 'px)';
  }

  function stageWord(){
    if (dmg >= BREACH)                    return 'breached';
    if (dmg >= CRACK_HITS + CHUNK_HITS)   return 'failing';
    if (dmg >= CRACK_HITS)                return 'breaching';
    return 'holding';
  }

  function hudText(){
    hud.innerHTML = on
      ? 'shots <b>'+shots+'</b> · hits <b>'+hits+'</b> · wall <b>'+Math.max(0,BREACH-dmg)+'</b> '
        + stageWord() + (best?' · best <b>'+best+'</b>':'')
      : '';
  }

  function burst(x,y){
    hitG.style.animation='none';
    hitG.setAttribute('transform','translate('+(x-258)+','+(y-150)+')');
    hitG.style.opacity=1; hitG.style.transform='scale(1)';
    setTimeout(function(){ hitG.style.transition='opacity .45s, transform .45s';
      hitG.style.opacity=0; hitG.style.transform='scale(2.1)'; }, 20);
    setTimeout(function(){ hitG.style.transition=''; }, 500);
    if (shake){ shake.style.animation='none'; void shake.offsetWidth;
      shake.style.animation='shake .55s linear'; }
  }

  function showCrack(i){
    if (!cracks[i]) return;
    cracks[i].style.transition='opacity .35s';
    cracks[i].style.opacity=.95;
  }

  // Where each crack sits, measured from the DOM rather than transcribed from
  // the path data into a second list that could fall out of step with it.
  var crackAt = null;
  function crackCentres(){
    if (crackAt) return crackAt;
    crackAt = [];
    for (var i=0;i<cracks.length;i++){
      var c = { cx:-999, cy:-999 };
      try {
        var bb = cracks[i].getBBox();
        c.cx = bb.x + bb.width/2;
        c.cy = bb.y + bb.height/2;
      } catch(e){ /* not rendered yet; leave it off the map */ }
      crackAt.push(c);
    }
    return crackAt;
  }

  function hideCracksNear(x,y,r){
    var cc = crackCentres();
    for (var i=0;i<cc.length;i++){
      if (!cracks[i]) continue;
      var dx = cc[i].cx - x, dy = cc[i].cy - y;
      if (dx*dx + dy*dy < r*r){
        cracks[i].style.transition='opacity .3s';
        cracks[i].style.opacity=0;
      }
    }
  }

  function puff(i, scale){
    var d = dust[i];
    if (!d) return;
    d.style.transition='none';
    d.style.transform='scale(.35)'; d.style.opacity='0';
    void d.getBoundingClientRect();
    d.style.transition='transform 1.3s ease-out, opacity 1.3s ease-out';
    d.style.transform='scale('+scale.toFixed(2)+') translateY(-7px)';
    d.style.opacity='.5';
    setTimeout(function(){ d.style.opacity='0'; }, 500);
  }

  // One integration step for every piece that is in the air. Called from the
  // same requestAnimationFrame loop that flies the projectile, so the debris
  // obeys the same clock as everything else on screen.
  function stepDebris(){
    for (var i=0;i<PIECES.length;i++){
      var q = PIECES[i];
      if (q.state !== 1) continue;
      if (q.delay > 0){ q.delay--; continue; }

      q.vy += D_GRAV;
      q.x  += q.vx;
      q.y  += q.vy;
      q.rot += q.vr;

      // Rest height comes from what has already landed nearby, so the debris
      // stacks into a mound instead of lining up flat along the ground.
      var b     = bucketOf(q.cx + q.x);
      var floor = pileTop[b] - q.cy;

      if (q.y >= floor){
        q.y = floor;
        if (Math.abs(q.vy) < SLEEP_V){
          q.vy = 0; q.vx = 0; q.vr = 0; q.state = 2;
          dropPile(b, PILE_STEP);                  // the heap grows
          if (b > 0)          dropPile(b-1, PILE_STEP*0.35);
          if (b < BUCKETS-1)  dropPile(b+1, PILE_STEP*0.35);
        } else {
          q.vy *= BOUNCE; q.vx *= FRICTION; q.vr *= 0.45;
        }
      }
      q.el.style.transform = 'translate('+q.x.toFixed(2)+'px,'+q.y.toFixed(2)+'px) '
                           + 'rotate('+q.rot.toFixed(1)+'deg)';
    }
  }

  // Stage two: the blocks nearest the impact come clean out. The void is not
  // painted on - it is simply where a block used to be.
  function knockOut(x,y,count){
    var near = [];
    for (var i=0;i<PIECES.length;i++){
      var q = PIECES[i];
      if (q.state !== 0) continue;
      var dx = q.cx-x, dy = q.cy-y;
      near.push({ q:q, d:dx*dx + dy*dy });
    }
    near.sort(function(a,b){ return a.d - b.d; });
    var n = Math.min(count, near.length);
    for (var j=0;j<n;j++){
      var p2 = near[j].q;
      p2.state = 1;
      p2.vx = -rnd(0.26, 1.0);
      p2.vy = -rnd(0.16, 0.79);
      p2.vr = rnd(-4, 4);
      p2.delay = j*2;
      // A crack drawn across stone that is no longer there has nothing to be
      // a crack in, so it goes with the block.
      hideCracksNear(p2.cx, p2.cy, 15);
    }
    puff(Math.floor(rnd(0,dust.length)), 1.0);
  }

  // Stage three. Every block still standing lets go, base first, so the wall
  // sits down into itself and the upper courses topple out over the rubble.
  function collapse(){
    falling = true;
    if (shake){
      shake.style.animation='none'; void shake.offsetWidth;
      shake.style.animation='quake 1.2s ease-out';
    }
    var topY = WALL.y0, span = Math.max(1, BASE_Y - topY);
    for (var i=0;i<PIECES.length;i++){
      var q = PIECES[i];
      if (q.state !== 0) continue;
      var h = (BASE_Y - q.cy) / span;          // 1 at the parapet, 0 at the base
      q.state = 1;
      // Near-simultaneous release. The first version staggered by 16 frames
      // from the base up, which left the whole upper wall hanging unsupported
      // in mid-air for a quarter second before it dropped onto the rubble
      // that had already settled underneath it. That pause is what looked
      // like the wall reassembling itself. Gravity gives the cascade for
      // free, because the high blocks have further to fall.
      q.delay = Math.round((1-h)*5 + rnd(0,4));
      q.vx = -(0.13 + h*1.10) * rnd(0.55,1.25); // the top still carries furthest
      q.vy = -rnd(0, 0.48);
      q.vr = rnd(-5, 5);
    }
    // The painted detail is not masonry and must not hang in the air.
    if (trimG){
      trimG.style.transition='opacity .45s ease-in';
      trimG.style.opacity='0';
    }
    for (var d=0;d<dust.length;d++) puff(d, 1.8);

    if (hits > best || best===0){
      best = hits;
      try{ localStorage.setItem('fr_siege_best', best); }catch(e){}
    }
    setTimeout(rebuild, 3400);   // the fall now takes ~1.6s; let the ruin sit
  }

  function applyDamage(n,x,y){
    if (n <= CRACK_HITS){
      showCrack(n-1);
    } else if (n <= CRACK_HITS + CHUNK_HITS){
      showCrack(CRACK_HITS + (n - CRACK_HITS - 1));   // keep spidering
      knockOut(x, y, rndInt(2,3));
    } else {
      collapse();
    }
  }

  function land(hit,x,y){
    shots++;
    if (hit && !falling){
      hits++;
      if (dmg < BREACH){ dmg++; applyDamage(dmg, x, y); }
      burst(x,y);
    }
    p=null; phase='spent'; hudText();
    setTimeout(function(){ if(on && phase==='spent'){ phase='ready'; t=0; power=0; draw(); } }, 700);
  }

  // Cut the wall into blocks. A jittered lattice, not a grid: every vertex is
  // nudged, so no two blocks are the same rectangle and the courses do not
  // line up into the obvious chequerboard the first version had.
  //
  // The parapet falls out of the same lattice. A cell in the top band only
  // becomes a block if it sits under a merlon, so the crenellated outline is
  // a consequence of which blocks exist rather than a shape drawn on top.
  function buildWall(){
    clearKids(piecesG);
    PIECES.length = 0;
    pileTop.length = 0;
    for (var b=0;b<BUCKETS;b++) pileTop[b] = BASE_Y;

    var capY  = [104,108,112][rndInt(0,2)];
    var faceY = capY + 14;

    var n = rndInt(3,5), mw = 14, gap = (SPAN_X1 - SPAN_X0 - n*mw) / (n-1);
    var merlons = [];
    for (var i=0;i<n;i++){
      var mx = SPAN_X0 + i*(mw+gap);
      merlons.push([mx, mx+mw]);
    }

    var COLS = 7, ROWS = 8, pts = [], r, c;
    for (r=0;r<=ROWS;r++){
      pts[r] = [];
      for (c=0;c<=COLS;c++){
        var px = SPAN_X0 + (SPAN_X1-SPAN_X0)*c/COLS;
        var py = capY    + (BASE_Y-capY)   *r/ROWS;
        if (c>0 && c<COLS) px += rnd(-2.6,2.6);
        if (r>0 && r<ROWS) py += rnd(-2.3,2.3);
        pts[r][c] = [px,py];
      }
    }

    for (r=0;r<ROWS;r++){
      for (c=0;c<COLS;c++){
        var a=pts[r][c], bb=pts[r][c+1], d=pts[r+1][c+1], e=pts[r+1][c];
        var cx=(a[0]+bb[0]+d[0]+e[0])/4, cy=(a[1]+bb[1]+d[1]+e[1])/4;

        if (cy < faceY){                       // parapet band
          var inM=false;
          for (var m=0;m<merlons.length;m++)
            if (cx>=merlons[m][0] && cx<=merlons[m][1]) inM=true;
          if (!inM) continue;
        }
        if (cx>GATE_X0 && cx<GATE_X1 && cy>168) continue;   // gateway void

        var path = document.createElementNS(NS,'path');
        path.setAttribute('d','M'+a[0].toFixed(1)+','+a[1].toFixed(1)
                            +'L'+bb[0].toFixed(1)+','+bb[1].toFixed(1)
                            +'L'+d[0].toFixed(1)+','+d[1].toFixed(1)
                            +'L'+e[0].toFixed(1)+','+e[1].toFixed(1)+'Z');
        piecesG.appendChild(path);
        PIECES.push({ el:path, cx:cx, cy:cy, x:0, y:0,
                      vx:0, vy:0, rot:0, vr:0, state:0, delay:0 });
      }
    }

    clearKids(slitsG);
    var sn = rndInt(2,4);
    for (var j=0;j<sn;j++){
      var sx, guard=0;
      do { sx = rnd(SPAN_X0+8, SPAN_X1-12); guard++; }
      while (sx > GATE_X0-6 && sx < GATE_X1+2 && guard < 24);
      var s = document.createElementNS(NS,'rect');
      s.setAttribute('x', sx.toFixed(1));
      s.setAttribute('y', (faceY + rnd(8,24)).toFixed(1));
      s.setAttribute('width', 4);
      s.setAttribute('height', rnd(10,15).toFixed(1));
      slitsG.appendChild(s);
    }

    // One owner: the hit box comes from the geometry just drawn rather than
    // being written down a second time and left to drift.
    WALL.y0 = capY;
  }

  // Wipe every damage visual without animating. Used by the rebuild and by
  // standing down, which must not leave half a collapse on screen.
  function clearDamage(){
    dmg=0; hits=0; shots=0; falling=false;
    var i;
    for (i=0;i<cracks.length;i++){ cracks[i].style.transition='none'; cracks[i].style.opacity=0; }
    for (i=0;i<dust.length;i++){   dust[i].style.transition='none';
                                   dust[i].style.transform='';    dust[i].style.opacity='0'; }
    if (trimG){ trimG.style.transition='none'; trimG.style.opacity='1'; }
    if (shake){ shake.style.animation=''; }
  }

  function rebuild(){
    clearDamage();
    buildWall();
    if (wallG){
      wallG.style.transition='none';
      wallG.style.transform='translate(0px,14px)';
      wallG.style.opacity='0';
      void wallG.getBoundingClientRect();
      wallG.style.transition='transform .6s ease-out, opacity .6s ease-out';
      wallG.style.transform='';
      wallG.style.opacity='1';
    }
    hudText();
  }

  function loop(){
    if (!on) return;
    if (phase==='charging'){
      power = Math.min(1, power + 0.017);
      fill.style.width = (power*100).toFixed(0)+'%';
    }
    if (phase==='throw'){
      // A harder wind swings the arm faster, so release speed comes out of
      // the geometry rather than being a separate made-up number.
      var prevQ = pouchAt(angAt(t), sAt(t));
      t += WIND_BASE + WIND_GAIN*power;
      if (!p && t >= REL_T){
        var q = pouchAt(angAt(t), sAt(t));
        p = { x:q[0], y:q[1],
              vx:(q[0]-prevQ[0])*GAIN, vy:(q[1]-prevQ[1])*GAIN };
      }
      if (t>SWEEP*1.6 && !p){ phase='spent'; setTimeout(function(){ if(on){phase='ready';t=0;power=0;} },600); }
    }
    if (p){
      p.x += p.vx; p.y += p.vy; p.vy += GRAV;
      // The wall lives in scene coordinates, the stone in the rig's. Convert
      // here and nowhere else, and hand land() the scene position so the
      // impact flash and the block it dislodges agree on where it struck.
      var sx = toSceneX(p.x), sy = toSceneY(p.y);
      var inWall = sx>=WALL.x0 && sx<=WALL.x1 && sy>=WALL.y0 && sy<=WALL.y1;
      var gone   = sy >= GROUND || sx > 402;
      if (inWall || gone) land(inWall, sx, sy);
    }
    // Follow-through: the machine finishes its motion after the shot has gone.
    if (phase==='spent' && t < SLING_SWEEP) t += 0.9;
    stepDebris();      // masonry falls on the same clock as the stone
    draw();
    raf = requestAnimationFrame(loop);
  }

  function arm(){
    if (on) return;
    on = true; stage.classList.add('playing');
    hint.textContent = PLAY; hint.classList.add('on');
    phase='ready'; t=0; power=0; p=null; rebuild(); draw();
    raf = requestAnimationFrame(loop);
  }
  function disarm(){
    on=false; charging=false; phase='ready'; p=null;
    cancelAnimationFrame(raf);
    stage.classList.remove('playing');
    [beam, cw, sling, shot].forEach(function(el){ el.style.transform = ''; });
    shot.style.opacity=''; hitG.style.opacity=''; hitG.style.transform=''; hitG.style.animation='';
    // Standing down mid-collapse must not leave a half-fallen wall on the
    // idle screen, so the wall group is put back as well as the damage.
    clearDamage();
    if (wallG){ wallG.style.transition='none'; wallG.style.transform=''; wallG.style.opacity='1'; }
    hud.innerHTML=''; meter.classList.remove('on'); idleAt=Date.now();
    hint.textContent = TAKE;
  }

  function press(){
    if (!on) { arm(); return; }
    if (phase!=='ready') return;
    charging=true; phase='charging'; power=0;
    meter.classList.add('on'); fill.style.width='0%';
  }
  function release(){
    if (!on || phase!=='charging') return;
    charging=false; phase='throw'; t=0; meter.classList.remove('on');
  }

  addEventListener('keydown', function(e){
    if (e.code==='Space'){ e.preventDefault(); if(!e.repeat) press(); }
    if (e.code==='Escape' && on) disarm();
  });
  addEventListener('keyup', function(e){ if (e.code==='Space'){ e.preventDefault(); release(); } });
  stage.addEventListener('pointerdown', function(e){ e.preventDefault(); press(); });
  addEventListener('pointerup', release);

  if (quit) quit.addEventListener('pointerdown', function(e){
    e.preventDefault(); e.stopPropagation(); disarm();
  });

  stage.classList.add('armable');
  hint.textContent = TAKE;
  // Plain timer, not an idle timer. The parallax means the pointer is
  // almost always moving, so an idle gate never fired on desktop.
  setTimeout(function(){ hint.classList.add('on'); }, 3500);
})();
</script>
</body>
</html>
